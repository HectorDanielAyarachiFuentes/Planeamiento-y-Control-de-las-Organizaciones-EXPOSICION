<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <!-- Filtros de Sombra y Brillo Neón -->
    <filter id="preview-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.3" />
    </filter>
    <filter id="card-soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#050c17" flood-opacity="0.5" />
    </filter>

    <!-- Gradientes de Fondo y Tarjetas -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c17" />
      <stop offset="50%" stop-color="#0b182b" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10233d" />
      <stop offset="100%" stop-color="#0c1b30" />
    </linearGradient>

    <linearGradient id="gold-pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cyan-pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emerald-pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="curzas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Fondo Principal con Retícula Isométrica Tecnológica -->
  <rect width="960" height="640" rx="16" fill="url(#bg-grad)" stroke="#1e3a5f" stroke-width="2" />
  
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="320" x2="960" y2="320" />
    <line x1="0" y1="480" x2="960" y2="480" />
    <line x1="240" y1="0" x2="240" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
  </g>

  <!-- Cabecera Institucional y Título del Dashboard -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="896" height="76" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1.5" filter="url(#card-soft-shadow)" />
    
    <!-- Badge Superior -->
    <rect x="18" y="14" width="220" height="22" rx="6" fill="#0369a1" opacity="0.8" />
    <text x="28" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      📊 EJERCICIO FISCAL 2026 • LEY APN
    </text>

    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">
      Presupuesto Universitario Nacional y Centralidad CURZAS
    </text>

    <rect x="674" y="16" width="204" height="44" rx="8" fill="#0f233d" stroke="#38bdf8" stroke-width="1" />
    <text x="686" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">
      SISTEMA INTERACTIVO
    </text>
    <text x="686" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">
      🌐 3D ISOMÉTRICO (ATAJO: 3)
    </text>
  </g>

  <!-- COLUMNAS COMPARATIVAS ESCALONADAS (MACRO A MICRO) -->

  <!-- Tarjeta 1: PBI Nacional -->
  <g transform="translate(32, 120)">
    <rect width="206" height="300" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1.2" filter="url(#card-soft-shadow)" />
    <rect x="14" y="14" width="178" height="20" rx="4" fill="rgba(56,189,248,0.15)" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">1. PBI ARGENTINA</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">$1.035,5 B</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">100% Macroeconomía Total</text>

    <!-- Barra Isométrica PBI -->
    <rect x="14" y="100" width="178" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="22" y="110" width="162" height="130" rx="4" fill="url(#cyan-pillar)" opacity="0.9" filter="url(#preview-glow)" />
    <text x="103" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#050c17" text-anchor="middle">
      PBI GLOBAL
    </text>

    <text x="14" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">
      Base macroeconómica 2026
    </text>
  </g>

  <!-- Tarjeta 2: Presupuesto Nacional (APN) -->
  <g transform="translate(262, 120)">
    <rect width="206" height="300" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1.2" filter="url(#card-soft-shadow)" />
    <rect x="14" y="14" width="178" height="20" rx="4" fill="rgba(16,185,129,0.15)" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#10b981">2. PRESUPUESTO APN</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">$148,1 B</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#10b981">14,3% del PBI Argentino</text>

    <!-- Barra Isométrica APN -->
    <rect x="14" y="100" width="178" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="22" y="145" width="162" height="95" rx="4" fill="url(#emerald-pillar)" opacity="0.95" />
    <text x="103" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      Gasto APN Total
    </text>

    <text x="14" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">
      Administración Nacional Ley
    </text>
  </g>

  <!-- Tarjeta 3: Universidades Nacionales -->
  <g transform="translate(492, 120)">
    <rect width="206" height="300" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1.2" filter="url(#card-soft-shadow)" />
    <rect x="14" y="14" width="178" height="20" rx="4" fill="rgba(251,191,36,0.15)" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">3. SISTEMA UNIV. (61)</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">$4,87 B</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#fbbf24">3,29% del Presupuesto APN</text>

    <!-- Barra Isométrica Universidades -->
    <rect x="14" y="100" width="178" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="22" y="190" width="162" height="50" rx="4" fill="url(#gold-pillar)" opacity="0.95" filter="url(#gold-glow)" />
    <text x="103" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#050c17" text-anchor="middle">
      61 Universidades
    </text>

    <text x="14" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">
      UNCo: $73.900 M (1,52%)
    </text>
  </g>

  <!-- Tarjeta 4: CURZAS - Sede Viedma e Inciso 1 (Destacada) -->
  <g transform="translate(722, 120)">
    <rect width="206" height="300" rx="12" fill="url(#card-grad)" stroke="#fbbf24" stroke-width="2" filter="url(#gold-glow)" />
    <rect x="14" y="14" width="178" height="20" rx="4" fill="#fbbf24" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#050c17">★ 4. CURZAS - UNCo</text>
    
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#fbbf24">$4.877 M</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">6,6% del Presupuesto UNCo</text>

    <!-- Gráfico Circular Isométrico de Absorción Inciso 1 -->
    <g transform="translate(103, 175)">
      <!-- Círculo de Fondo (Funcionamiento 9.8%) -->
      <circle r="46" fill="#1e3a5f" stroke="#ef4444" stroke-width="10" stroke-dasharray="290" stroke-dashoffset="0" />
      <!-- Arco Inciso 1 Personal (90.2%) -->
      <circle r="46" fill="none" stroke="#fbbf24" stroke-width="12" stroke-dasharray="289" stroke-dashoffset="28" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">90,2%</text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">INCISO 1</text>
    </g>

    <text x="14" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="start">
      • Salarios: $4.401 M (90,2%)
    </text>
    <text x="14" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="start">
      • Operativo: $476 M (9,8%)
    </text>
  </g>

  <!-- PANEL INFERIOR: RESUMEN METODOLÓGICO Y LLAMADO AL DASHBOARD 3D -->
  <g transform="translate(32, 440)">
    <rect width="896" height="170" rx="12" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="1.2" filter="url(#card-soft-shadow)" />

    <g transform="translate(24, 20)">
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">
        📌 HALLAZGO CRÍTICO DE LA PREGUNTA GUÍA DOCENTE (AVANCE 4)
      </text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
        • La concentración del <tspan font-weight="800" fill="#fbbf24">90,2% en masa salarial (Inciso 1)</tspan> responde a dos factores legales: la Zona Desfavorable Patagónica (+40%)
      </text>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
        y la estabilidad laboral tutelada por los Convenios Colectivos CCT 366/06 (Nodocente) y CCT 1246/15 (Docente).
      </text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">
        • Apenas el <tspan font-weight="800" fill="#fca5a5">9,8% ($476M)</tspan> financia servicios básicos (luz, gas, internet) y traslados a los 10 nodos territoriales de Río Negro.
      </text>
    </g>

    <!-- Botón / Banner Interactivo de Acceso al Dashboard -->
    <g transform="translate(24, 115)">
      <rect width="848" height="42" rx="8" fill="linear-gradient(90deg, #0f3460, #0284c7)" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ffffff">
        🌐 DASHBOARD ISOMÉTRICO 3D COMPLETO: Mapa Nacional, Comparador de 61 Universidades y Gráficos Volumétricos
      </text>
      <rect x="730" y="8" width="104" height="26" rx="6" fill="#fbbf24" />
      <text x="782" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#050c17" text-anchor="middle">
        VER 3D (Tecla 3)
      </text>
    </g>
  </g>
</svg>